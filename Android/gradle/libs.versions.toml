[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.4"
securityCrypto = "1.1.0-alpha06"

# Shoplive SDK v3 — one version for both Player and Streamer.
# The two entry-point artifacts are only ever bumped together. Everything else
# (core, core-player, exoplayer, webrtc, android-webrtc, rtmp) arrives transitively
# and carries its own version line — do not pin those here.
# Releases: https://github.com/shoplive/shoplive-sdk-android/releases
shoplive = "3.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Shoplive SDK ────────────────────────────────────────────────────────────
# From the public distribution channel wired up in settings.gradle.kts.
# Watching only -> player-sdk / broadcasting only -> streamer-sdk / both -> both.
# Everything else is a POM transitive you do not declare, and the overlap between
# the two entry points is de-duplicated by version.
shoplive-player-sdk = { group = "cloud.shoplive", name = "shoplive-player-sdk", version.ref = "shoplive" }
# The shared public surface (Shoplive, ShopliveUser, ShopliveConfiguration,
# ShopliveError) lives in shoplive-core.
# On the published channel you do NOT need this line: the released POMs list
# shoplive-core at compile scope, so it is already on the consumer's compile
# classpath. Verified 2026-08-12 by compiling :integration with this declaration
# removed against shoplive-{player,streamer}-sdk:3.0.0 from the GitHub Maven repo.
# It is still declared (integration/build.gradle.kts) for the composite build, where
# the SDK's own modules consume core with implementation/compileOnly.
shoplive-core = { group = "cloud.shoplive", name = "shoplive-core", version.ref = "shoplive" }
shoplive-streamer-sdk = { group = "cloud.shoplive", name = "shoplive-streamer-sdk", version.ref = "shoplive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
