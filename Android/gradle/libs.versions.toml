[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigation = "2.8.4"
securityCrypto = "1.1.0-alpha06"

# Shoplive unified SDK v3 — one version for both Player and Streamer.
# The two artifacts are only ever bumped together (core is an internal dependency
# and is not declared).
shoplive = "3.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Shoplive SDK ────────────────────────────────────────────────────────────
# Watching only -> player-sdk / broadcasting only -> streamer-sdk / both -> both.
# core, exoplayer, webrtc and android-webrtc are internal dependencies you do not
# declare, and the overlap between the two is resolved by the SDK.
shoplive-player-sdk = { group = "cloud.shoplive", name = "shoplive-player-sdk", version.ref = "shoplive" }
# The shared public surface (Shoplive, ShopliveUser, ShopliveConfiguration,
# ShopliveError) lives in shoplive-core. Both SDK modules depend on it internally
# (`implementation` / `compileOnly`), so it is NOT on a consumer's compile classpath
# and has to be declared to use those types by name.
# Measured 2026-07-30 against the local SDK sources (composite build), SDK 3.0.0.
# TODO(verify): the same check against the published AAR. The private Maven
# credentials were not available on the machine where this was measured, and the
# generated pom drops all `cloud.shoplive` dependencies
# (shoplive-core/build.gradle, pom.withXml), which suggests AAR consumers need this
# line too — but that has not been observed, only read.
shoplive-core = { group = "cloud.shoplive", name = "shoplive-core", version.ref = "shoplive" }
shoplive-streamer-sdk = { group = "cloud.shoplive", name = "shoplive-streamer-sdk", version.ref = "shoplive" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
