name: Shortform SDK CI

on:
  push:
    branches: ["**"]
    paths: ["ShortformSDK/**", ".github/workflows/shortform-ci.yml"]
  pull_request:
    paths: ["ShortformSDK/**", ".github/workflows/shortform-ci.yml"]

jobs:
  catalog:
    name: Demo catalog schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the sample catalog
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, jsonschema
          base = "ShortformSDK/demo-config/"
          jsonschema.validate(json.load(open(base + "catalog.sample.json")), json.load(open(base + "catalog.schema.json")))
          print("catalog.sample.json is valid")
          PY

  android:
    name: Android demo app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ShortformSDK/Android
    # The Shortform SDK comes from the public Maven repository (https://sdk.shoplive.cloud/maven-repo):
    # no secrets, so this runs on every push and on forks. The app builds without an access key.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ShortformSDK/Android

      - name: Build the demo app and run unit tests
        run: ./gradlew :app:assembleDebug test
