name: Android CI

on:
  push:
    branches: ["**"]
    paths: ["Android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["Android/**", ".github/workflows/android-ci.yml"]

defaults:
  run:
    working-directory: Android

jobs:
  boundary:
    # The copy-paste boundary is checked first and on its own, so it still runs even
    # if the build job breaks. Reviewers cannot be the enforcement here — adding one
    # convenient log line to Android/integration/ is too easy, and that is exactly
    # what breaks a customer's copy of these files.
    name: Integration boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan integration/ for harness dependencies
        run: python3 scripts/integration_boundary_scanner.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: boundary
    # The SDK comes from a public Maven repository (the maven-repo branch of
    # shoplive/shoplive-sdk-android), so there are no secrets to configure and the
    # build runs on every push and on forks.
    env:
      # CI builds against the published AAR, not a local SDK checkout.
      SHOPLIVE_SDK_USE_LOCAL: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: Android

      # The proof that the files are copyable: this module is compiled with the SDK
      # and nothing else. It does not depend on :app, so a harness dependency in
      # integration/ fails here even when the scanner's patterns miss it.
      - name: Compile the copy-paste layer in isolation
        run: ./gradlew :integration:assembleDebug

      - name: Build the demo app
        run: ./gradlew :app:assembleDebug

      - name: Verification tasks
        run: ./gradlew check
